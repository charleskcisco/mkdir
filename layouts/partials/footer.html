<footer class="site-footer">
  <div class="page">
    {{ partial "h-card.html" . }}

    <div class="footer-meta">
      {{ partial "theme-toggle.html" . }}
      <a href="{{ "/feed.xml" | relURL }}">feed.xml</a>
      <a href="{{ "/feed.json" | relURL }}">feed.json</a>
      {{ with .Site.Params.author.username }}<a href="https://micro.blog/{{ . }}">micro.blog/{{ . }}</a>{{ end }}
    </div>
  </div>

  {{ if templates.Exists "partials/microblog_syndication.html" }}{{ partial "microblog_syndication.html" . }}{{ end }}
</footer>
