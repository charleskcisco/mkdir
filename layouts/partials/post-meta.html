<div class="post-meta">
  <time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
    {{ .Date.Format "2006-01-02 15:04 MST" }}
  </time>
  {{ with .Params.tags }}
    <span class="post-tags">
      {{ range . }}<a href="{{ "/tags/" | relURL }}{{ . | urlize }}/" class="p-category">/{{ . | urlize }}/</a>{{ end }}
    </span>
  {{ end }}
  {{ with .Params.categories }}
    <span class="post-tags">
      {{ range . }}<a href="{{ "/categories/" | relURL }}{{ . | urlize }}/" class="p-category">/{{ . | urlize }}/</a>{{ end }}
    </span>
  {{ end }}
</div>
